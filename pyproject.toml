[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanhound"
version = "0.6.1"
description = "Capture and inspect local agent traces, failures, approvals, and run regressions over MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Abhishek Ash", email = "ash.abhishek@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "observability", "opentelemetry", "agent-evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "opentelemetry-proto>=1.45,<2",
]

[project.optional-dependencies]
auto = [
    "opentelemetry-distro>=0.66b1,<0.67",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-httpx>=0.66b1,<0.67",
    "opentelemetry-instrumentation-requests>=0.66b1,<0.67",
    "opentelemetry-instrumentation-genai-openai>=1.2b0,<1.3",
    "opentelemetry-instrumentation-genai-anthropic>=1.2b0,<1.3",
    "opentelemetry-instrumentation-genai-openai-agents>=1.2b0,<1.3",
]
dev = [
    "pytest>=8",
    "openai>=1.26,<4",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[project.scripts]
spanhound = "mcp_trace.server:main"
# Keep the previous command for users upgrading an existing MCP configuration.
mcp-trace-inspector = "mcp_trace.server:main"
agenthawk = "mcp_trace.server:main"
agent-hawk = "mcp_trace.server:main"
mcp-trace = "mcp_trace.server:main"
abhishekash-mcp-trace = "mcp_trace.server:main"

[project.urls]
Documentation = "https://github.com/abhishekash/spanhound/blob/main/docs/user-guide.md"
Changelog = "https://github.com/abhishekash/spanhound/releases"
Homepage = "https://github.com/abhishekash/spanhound"
Repository = "https://github.com/abhishekash/spanhound"
Issues = "https://github.com/abhishekash/spanhound/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trace", "src/agenthawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
