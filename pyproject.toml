[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-trace-inspector"
version = "0.3.0"
description = "Agent observability MCP server for querying OpenTelemetry traces, failures, tool health, security evidence, and regressions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Abhishek Ash", email = "ash.abhishek@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "observability", "opentelemetry", "agent-evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-trace-inspector = "mcp_trace.server:main"
agenthawk = "mcp_trace.server:main"
agent-hawk = "mcp_trace.server:main"
mcp-trace = "mcp_trace.server:main"
abhishekash-mcp-trace = "mcp_trace.server:main"

[project.urls]
Homepage = "https://github.com/abhishekash/mcp-trace-inspector"
Repository = "https://github.com/abhishekash/mcp-trace-inspector"
Issues = "https://github.com/abhishekash/mcp-trace-inspector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trace", "src/agenthawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
